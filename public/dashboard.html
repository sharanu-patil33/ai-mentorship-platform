<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Progress</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f7;
    margin: 0;
    padding: 24px;
  }
  .app {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 24px;
  }
  h1 { margin-top: 0; font-size: 20px; }
  #loadRow {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  #loadRow input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  #loadRow button {
    padding: 10px 16px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .student-header {
    padding: 12px 16px;
    background: #fafafa;
    border-radius: 8px;
    margin-bottom: 20px;
  }
  .program-block {
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .program-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .program-title-row h3 { margin: 0; }
  .progress-fraction { font-size: 13px; color: #666; }
  .progress-bar-track {
    width: 100%;
    height: 6px;
    background: #eee;
    border-radius: 3px;
    overflow: hidden;
    margin: 8px 0 14px;
  }
  .progress-bar-fill {
    height: 100%;
    background: #111;
  }
  .concept-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-top: 1px solid #f5f5f5;
    gap: 10px;
  }
  .concept-row:first-of-type { border-top: none; }
  .concept-name { font-size: 14px; }
  .status-pill {
    font-size: 11px;
    padding: 2px 10px;
    border-radius: 10px;
    white-space: nowrap;
  }
  .status-pill.not_started { background: #f1f3f5; color: #868e96; }
  .status-pill.in_progress { background: #fff3bf; color: #e67700; }
  .status-pill.completed { background: #d3f9d8; color: #2b8a3e; }
  .status-pill.needs_review { background: #ffe3e3; color: #c92a2a; }
  .concept-notes {
    font-size: 12px;
    color: #888;
    margin-top: 2px;
    font-style: italic;
  }
  .error { color: #e03131; font-size: 14px; }
</style>
</head>
<body>

<div class="app">
  <h1>My Progress</h1>
  <div id="result"></div>
</div>

<script>
  const API_BASE = "http://localhost:3000/api";

  // Prefer the logged-in session; fall back to a studentId in the URL (used by the direct link after program selection)
  const params = new URLSearchParams(window.location.search);
  const loggedInStudentId = localStorage.getItem("studentId");
  const studentIdToLoad = loggedInStudentId || params.get("studentId");

  if (!studentIdToLoad) {
    window.location.href = "auth.html";
  } else {
    loadDashboardById(studentIdToLoad);
  }

  async function loadDashboardById(studentId) {
    const resultEl = document.getElementById("result");
    resultEl.innerHTML = "<p>Loading...</p>";

    const res = await fetch(`${API_BASE}/student/${studentId}/dashboard`);
    const data = await res.json();

    if (data.error) {
      resultEl.innerHTML = `<p class="error">${data.error}</p>`;
      return;
    }

    renderDashboard(data);
  }

  function statusLabel(status) {
    return status.replace("_", " ");
  }

  function renderDashboard(data) {
    const resultEl = document.getElementById("result");

    const header = `
      <div class="student-header">
        <strong>${data.student.name}</strong> — ${data.student.email}
      </div>
    `;

    if (!data.programs.length) {
      resultEl.innerHTML = header + "<p>You haven't selected any programs yet.</p>";
      return;
    }

    const blocks = data.programs.map(p => {
      const pct = p.totalConcepts ? Math.round((p.completedConcepts / p.totalConcepts) * 100) : 0;

      const conceptRows = p.concepts.map(c => `
        <div class="concept-row">
          <div>
            <div class="concept-name">${c.concept_name}</div>
            ${c.mentor_notes ? `<div class="concept-notes">${c.mentor_notes}</div>` : ""}
          </div>
          <span class="status-pill ${c.status}">${statusLabel(c.status)}</span>
        </div>
      `).join("");

      return `
        <div class="program-block">
          <div class="program-title-row">
            <h3>${p.programName}</h3>
            <span class="progress-fraction">${p.completedConcepts}/${p.totalConcepts} completed</span>
          </div>
          <div class="progress-bar-track">
            <div class="progress-bar-fill" style="width:${pct}%;"></div>
          </div>
          ${conceptRows}
        </div>
      `;
    }).join("");

    resultEl.innerHTML = header + blocks;
  }
</script>

</body>
</html>
