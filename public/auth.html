<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f7;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px;
  }
  h1 { margin-top: 0; font-size: 20px; }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    border-bottom: 1px solid #eee;
  }
  .tab {
    padding: 8px 4px 10px;
    cursor: pointer;
    font-size: 14px;
    color: #999;
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: #111; border-bottom-color: #111; font-weight: 600; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 11px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .msg {
    font-size: 13px;
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 8px;
  }
  .msg.error { background: #ffe3e3; color: #c92a2a; }
  .msg.success { background: #d3f9d8; color: #2b8a3e; }
</style>
</head>
<body>

<div class="card">
  <h1>AI Interview Platform</h1>
  <div class="tabs">
    <div class="tab active" id="loginTab" onclick="switchTab('login')">Log In</div>
    <div class="tab" id="signupTab" onclick="switchTab('signup')">Sign Up</div>
  </div>

  <div id="loginForm">
    <input id="loginEmail" type="email" placeholder="Email" />
    <input id="loginPassword" type="password" placeholder="Password" />
    <button onclick="login()">Log In</button>
  </div>

  <div id="signupForm" style="display:none;">
    <input id="signupName" type="text" placeholder="Full name" />
    <input id="signupEmail" type="email" placeholder="Email" />
    <input id="signupPassword" type="password" placeholder="Password (min 6 characters)" />
    <button onclick="signup()">Sign Up</button>
  </div>

  <div id="messageBox"></div>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL = "https://mqlndwyxmscfbcoesgfj.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_p8TSdcMAwNOJg7KfipITaA_vvxXkA1x";

  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  window.supabaseClient = supabase;

  const API_BASE = "http://localhost:3000/api";

  window.switchTab = function (tab) {
    document.getElementById("loginTab").classList.toggle("active", tab === "login");
    document.getElementById("signupTab").classList.toggle("active", tab === "signup");
    document.getElementById("loginForm").style.display = tab === "login" ? "block" : "none";
    document.getElementById("signupForm").style.display = tab === "signup" ? "block" : "none";
    document.getElementById("messageBox").innerHTML = "";
  };

  function showMessage(text, type) {
    document.getElementById("messageBox").innerHTML = `<div class="msg ${type}">${text}</div>`;
  }

  window.signup = async function () {
    const name = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;

    if (!name || !email || !password) {
      showMessage("Please fill in all fields", "error");
      return;
    }
    if (password.length < 6) {
      showMessage("Password must be at least 6 characters", "error");
      return;
    }

    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: { data: { name } },
    });

    if (error) {
      showMessage(error.message, "error");
      return;
    }

    if (data.session) {
      // Email confirmation is off — logged in immediately
      await syncStudent(data.user, name);
    } else {
      // Email confirmation is on — user must check their inbox first
      showMessage("Account created! Check your email to confirm, then log in.", "success");
      switchTab("login");
    }
  };

  window.login = async function () {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    if (!email || !password) {
      showMessage("Please fill in all fields", "error");
      return;
    }

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      showMessage(error.message, "error");
      return;
    }

    await syncStudent(data.user);
  };

  async function syncStudent(user, name) {
    showMessage("Signing you in...", "success");

    const res = await fetch(`${API_BASE}/auth/sync-student`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        authUserId: user.id,
        email: user.email,
        name: name || user.user_metadata?.name,
      }),
    });
    const data = await res.json();

    if (data.error) {
      showMessage("Error: " + data.error, "error");
      return;
    }

    localStorage.setItem("studentId", data.student.id);
    localStorage.setItem("studentName", data.student.name);
    window.location.href = "index.html";
  }

  // If already logged in, skip straight to the app
  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      await syncStudent(session.user);
    }
  })();
</script>

</body>
</html>
