<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    --card-bg: rgba(30, 41, 59, 0.7);
    --card-border: rgba(255, 255, 255, 0.08);
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --primary-light: rgba(99, 102, 241, 0.15);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --success: #10b981;
    --success-light: rgba(16, 185, 129, 0.15);
    --danger: #ef4444;
    --danger-light: rgba(239, 68, 68, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-gradient);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    padding: 40px 32px;
  }

  .card-header {
    text-align: center;
    margin-bottom: 24px;
  }

  .logo-badge {
    font-size: 32px;
    width: 64px;
    height: 64px;
    background: var(--primary-light);
    border: 1px solid rgba(99, 102, 241, 0.3);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }

  h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: var(--text-main);
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    background: rgba(15, 23, 42, 0.6);
    padding: 6px;
    border-radius: 14px;
    border: 1px solid var(--card-border);
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    border-radius: 10px;
    transition: all 0.2s;
  }

  .tab.active {
    color: var(--text-main);
    background: var(--primary);
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
  }

  input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    font-size: 14px;
    color: var(--text-main);
    outline: none;
    font-family: inherit;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: var(--primary);
  }

  input::placeholder {
    color: #64748b;
  }

  button {
    width: 100%;
    padding: 13px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-top: 4px;
  }

  button:hover:not(:disabled) {
    background: var(--primary-hover);
    transform: translateY(-1px);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .msg {
    font-size: 13px;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    font-weight: 500;
    text-align: left;
  }

  .msg.error {
    background: var(--danger-light);
    color: var(--danger);
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  .msg.success {
    background: var(--success-light);
    color: var(--success);
    border: 1px solid rgba(16, 185, 129, 0.3);
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="logo-badge">🤖</div>
    <h1>AI Interview Platform</h1>
  </div>

  <div class="tabs">
    <div class="tab active" id="loginTab" onclick="switchTab('login')">Log In</div>
    <div class="tab" id="signupTab" onclick="switchTab('signup')">Sign Up</div>
  </div>

  <div id="loginForm">
    <input id="loginEmail" type="email" placeholder="Email" />
    <input id="loginPassword" type="password" placeholder="Password" />
    <button onclick="login()">Log In</button>
  </div>

  <div id="signupForm" style="display:none;">
    <input id="signupName" type="text" placeholder="Full name" />
    <input id="signupEmail" type="email" placeholder="Email" />
    <input id="signupPassword" type="password" placeholder="Password (min 6 characters)" />
    <button onclick="signup()">Sign Up</button>
  </div>

  <div id="messageBox"></div>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL = "https://mqlndwyxmscfbcoesgfj.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_p8TSdcMAwNOJg7KfipITaA_vvxXkA1x";

  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  window.supabaseClient = supabase;

  const API_BASE = "http://localhost:3000/api";

  window.switchTab = function (tab) {
    document.getElementById("loginTab").classList.toggle("active", tab === "login");
    document.getElementById("signupTab").classList.toggle("active", tab === "signup");
    document.getElementById("loginForm").style.display = tab === "login" ? "block" : "none";
    document.getElementById("signupForm").style.display = tab === "signup" ? "block" : "none";
    document.getElementById("messageBox").innerHTML = "";
  };

  function showMessage(text, type) {
    document.getElementById("messageBox").innerHTML = `<div class="msg ${type}">${text}</div>`;
  }

  window.signup = async function () {
    const name = document.getElementById("signupName").value.trim();
    const email = document.getElementById("signupEmail").value.trim();
    const password = document.getElementById("signupPassword").value;

    if (!name || !email || !password) {
      showMessage("Please fill in all fields", "error");
      return;
    }
    if (password.length < 6) {
      showMessage("Password must be at least 6 characters", "error");
      return;
    }

    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: { data: { name } },
    });

    if (error) {
      showMessage(error.message, "error");
      return;
    }

    if (data.session) {
      // Email confirmation is off — logged in immediately
      await syncStudent(data.user, name);
    } else {
      // Email confirmation is on — user must check their inbox first
      showMessage("Account created! Check your email to confirm, then log in.", "success");
      switchTab("login");
    }
  };

  window.login = async function () {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    if (!email || !password) {
      showMessage("Please fill in all fields", "error");
      return;
    }

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      showMessage(error.message, "error");
      return;
    }

    await syncStudent(data.user);
  };

  async function syncStudent(user, name) {
    showMessage("Signing you in...", "success");

    const res = await fetch(`${API_BASE}/auth/sync-student`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        authUserId: user.id,
        email: user.email,
        name: name || user.user_metadata?.name,
      }),
    });
    const data = await res.json();

    if (data.error) {
      showMessage("Error: " + data.error, "error");
      return;
    }

    localStorage.setItem("studentId", data.student.id);
    localStorage.setItem("studentName", data.student.name);
    window.location.href = "student-dashboard.html";
  }

  // Only auto-skip login if the user was redirected here (not if they opened auth.html directly)
  const cameFromApp = document.referrer && document.referrer.includes(window.location.hostname);

  if (cameFromApp) {
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        await syncStudent(session.user);
      }
    })();
  }
</script>

</body>
</html>
