<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Submissions – Mentor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #f5f5f7; }
  .container { max-width: 900px; margin: 0 auto; padding: 28px 20px; }
  a.back { font-size: 13px; color: #666; text-decoration: none; }
  h1 { font-size: 22px; margin: 12px 0 20px; }
  .card { background: #fff; border-radius: 12px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .row { font-size: 13px; margin: 6px 0; }
  .badge { font-size: 11px; padding: 3px 10px; border-radius: 10px; margin-left: 6px; }
  .submitted { background: #fff3bf; color: #e67700; }
  .approved { background: #d3f9d8; color: #2b8a3e; }
  .changes_requested { background: #ffe3e3; color: #c92a2a; }
  textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; margin: 8px 0; font-family: inherit; }
  button { border: 0; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-right: 6px; }
  .approve { background: #2b8a3e; color: #fff; }
  .changes { background: #e67700; color: #fff; }
</style>
</head>
<body>
<div class="container">
  <a class="back" href="mentor-dashboard.html">← Back to mentor dashboard</a>
  <p id="mentorName" style="font-size:13px;color:#666;margin-top:8px"></p>
  <h1>Project Submissions</h1>
  <div id="list">Loading...</div>
</div>
<script>
  const API_BASE = "http://localhost:3000/api";
  const mentorId = localStorage.getItem("mentorId");
  if (!mentorId) window.location.href = "mentor-auth.html";

  document.getElementById("mentorName").textContent =
    "Reviewing as " + (localStorage.getItem("mentorName") || "Mentor");

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  async function load() {
    const res = await fetch(`${API_BASE}/mentor/submissions`);
    const { submissions } = await res.json();
    document.getElementById("list").innerHTML = submissions.length
      ? submissions.map((s) => `
        <div class="card">
          <b>${esc(s.studentName)}</b> · ${esc(s.studentEmail)} · ${esc(s.programName)}
          <span class="badge ${s.status}">${s.status.replace("_", " ")}</span>
          <div class="row">PDF: ${s.pdfUrl ? `<a href="${esc(s.pdfUrl)}" target="_blank" rel="noopener">${esc(s.pdfName)}</a>` : "unavailable"}</div>
          <div class="row">Repo: <a href="${esc(s.repoUrl)}" target="_blank" rel="noopener">${esc(s.repoUrl)}</a></div>
          <div class="row">Submitted: ${new Date(s.submittedAt).toLocaleString()}</div>
          <textarea id="fb-${s.id}" rows="2" placeholder="Feedback for the student">${esc(s.mentorFeedback || "")}</textarea>
          <button class="approve" onclick="review(${s.id}, 'approved')">Approve</button>
          <button class="changes" onclick="review(${s.id}, 'changes_requested')">Request changes</button>
        </div>`).join("")
      : "<p>No submissions yet.</p>";
  }

  async function review(id, status) {
    const feedback = document.getElementById(`fb-${id}`).value;
    const res = await fetch(`${API_BASE}/mentor/submissions/${id}/review`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status, feedback, mentorId }),
    });
    if (!res.ok) return alert((await res.json()).error);
    load();
  }
  load();
</script>
</body>
</html>
