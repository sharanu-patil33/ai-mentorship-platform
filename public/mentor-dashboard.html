<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mentor Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    --card-bg: rgba(30, 41, 59, 0.7);
    --card-border: rgba(255, 255, 255, 0.08);
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --primary-light: rgba(99, 102, 241, 0.15);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --success: #10b981;
    --success-light: rgba(16, 185, 129, 0.15);
    --warning: #f59e0b;
    --warning-light: rgba(245, 158, 11, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-gradient);
    color: var(--text-main);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  header {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--card-border);
    padding: 18px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-info {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 16px;
    font-weight: 500;
  }

  .logout-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--card-border);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .logout-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-main);
    border-color: rgba(255, 255, 255, 0.2);
  }

  .container {
    max-width: 980px;
    margin: 0 auto;
    padding: 36px 24px;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 32px;
  }

  @media (max-width: 640px) {
    .stats-row { grid-template-columns: 1fr; }
  }

  .stat-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  .stat-card .num {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text-main);
    letter-spacing: -0.5px;
  }

  .stat-card .label {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
  }

  h2 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.4px;
    margin-bottom: 18px;
    color: var(--text-main);
  }

  .student-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 22px 26px;
    margin-bottom: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    text-decoration: none;
    color: inherit;
    flex-wrap: wrap;
  }

  .student-card:hover {
    border-color: rgba(99, 102, 241, 0.4);
    transform: translateY(-2px);
    box-shadow: 0 16px 36px rgba(0,0,0,0.3);
  }

  .student-info {
    flex: 1;
    min-width: 200px;
  }

  .student-info h3 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
    color: var(--text-main);
    letter-spacing: -0.2px;
  }

  .student-info p {
    font-size: 13px;
    color: var(--text-muted);
  }

  .student-meta {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .pill {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .pill.done {
    background: var(--success-light);
    color: var(--success);
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .pill.pending {
    background: var(--warning-light);
    color: var(--warning);
    border: 1px solid rgba(245, 158, 11, 0.3);
  }

  .pill.none {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-muted);
    border: 1px solid var(--card-border);
  }

  .card-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .view-btn {
    padding: 9px 16px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    transition: all 0.2s;
  }

  .view-btn:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
  }

  .sub-link {
    font-size: 12px;
    color: var(--text-muted);
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--card-border);
    transition: all 0.2s;
  }

  .sub-link:hover {
    color: var(--text-main);
    border-color: rgba(255, 255, 255, 0.2);
  }

  .empty {
    color: var(--text-muted);
    font-size: 14px;
    padding: 20px 0;
  }
</style>
</head>
<body>

<header>
  <h1>🎓 Mentor Portal</h1>
  <div class="user-info">
    <span id="mentorName">Loading...</span>
    <button class="logout-btn" onclick="logout()">Log Out</button>
  </div>
</header>

<div class="container">
  <div class="stats-row">
    <div class="stat-card">
      <div class="num" id="totalStudents">—</div>
      <div class="label">Total Students</div>
    </div>
    <div class="stat-card">
      <div class="num" id="interviewedStudents">—</div>
      <div class="label">Completed Interview</div>
    </div>
    <div class="stat-card">
      <div class="num" id="enrolledStudents">—</div>
      <div class="label">Enrolled in Programs</div>
    </div>
  </div>

  <h2>All Students</h2>
  <div id="studentList"><p class="empty">Loading students...</p></div>
</div>

<script>
  const API_BASE = "http://localhost:3000/api";

  const mentorId = localStorage.getItem("mentorId");
  const mentorName = localStorage.getItem("mentorName");

  if (!mentorId) {
    window.location.href = "mentor-auth.html";
  }

  document.getElementById("mentorName").textContent = mentorName || "Mentor";

  function logout() {
    localStorage.removeItem("mentorId");
    localStorage.removeItem("mentorName");
    window.location.href = "mentor-auth.html";
  }

  async function loadStudents() {
    const res = await fetch(`${API_BASE}/mentor/students`);
    const data = await res.json();

    if (data.error) {
      document.getElementById("studentList").innerHTML = `<p class="empty">${data.error}</p>`;
      return;
    }

    const students = data.students;
    const interviewed = students.filter(s => s.hasInterview).length;
    const enrolled = students.filter(s => s.programs.length > 0).length;

    document.getElementById("totalStudents").textContent = students.length;
    document.getElementById("interviewedStudents").textContent = interviewed;
    document.getElementById("enrolledStudents").textContent = enrolled;

    if (!students.length) {
      document.getElementById("studentList").innerHTML = `<p class="empty">No students registered yet.</p>`;
      return;
    }

    document.getElementById("studentList").innerHTML = students.map(s => `
      <div class="student-card" onclick="window.location.href='mentor.html?email=${encodeURIComponent(s.email)}'">
        <div class="student-info">
          <h3>${s.name}</h3>
          <p>${s.email}</p>
          <p style="font-size:12px; color:var(--text-muted); margin-top:6px;">
            <b>Topics:</b> ${(s.known_topics || []).join(", ") || "Not set"}
          </p>
        </div>
        <div class="student-meta">
          <span class="pill ${s.hasInterview ? 'done' : 'none'}">
            ${s.hasInterview ? '✓ Interviewed' : 'No Interview'}
          </span>
          <span class="pill ${s.programs.length > 0 ? 'done' : 'none'}">
            ${s.programs.length > 0
              ? s.programs.map(p => p.programs?.name).join(", ")
              : 'No Programs'}
          </span>
        </div>
        <div class="card-actions" onclick="event.stopPropagation()">
          <a class="view-btn" href="mentor.html?email=${encodeURIComponent(s.email)}">
            View Progress →
          </a>
          <a class="sub-link" href="mentor-submissions.html">Project Submissions</a>
        </div>
      </div>
    `).join("");
  }

  loadStudents();
</script>

</body>
</html>
