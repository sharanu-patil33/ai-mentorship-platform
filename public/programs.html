<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Choose Your Programs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    --card-bg: rgba(30, 41, 59, 0.7);
    --card-border: rgba(255, 255, 255, 0.08);
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --primary-light: rgba(99, 102, 241, 0.15);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --success: #10b981;
    --success-light: rgba(16, 185, 129, 0.15);
    --danger: #ef4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-gradient);
    color: var(--text-main);
    min-height: 100vh;
    padding: 36px 20px 60px;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 820px;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    padding: 36px;
    position: relative;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
  }

  .reasoning {
    background: rgba(15, 23, 42, 0.5);
    border: 1px solid var(--card-border);
    padding: 16px 20px;
    border-radius: 14px;
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 24px;
  }

  .program-card {
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.03);
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 18px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
  }

  .program-card:hover {
    border-color: rgba(99, 102, 241, 0.4);
    background: rgba(255, 255, 255, 0.05);
    transform: translateY(-2px);
  }

  .program-card.selected {
    border-color: var(--primary);
    background: var(--primary-light);
    box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
  }

  .program-card .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    background: var(--primary);
    color: #fff;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .program-card h3 {
    margin: 0 0 6px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text-main);
  }

  .program-card > p {
    margin: 0 0 16px;
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .concept-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 20px;
    font-size: 13px;
    color: var(--text-main);
    margin-top: 12px;
    padding-top: 14px;
    border-top: 1px solid var(--card-border);
  }

  .concept-list div {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .concept-list div::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary);
    display: inline-block;
  }

  #confirmBar {
    position: sticky;
    bottom: -36px;
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--card-border);
    padding: 20px 0 0;
    margin-top: 16px;
    margin-bottom: -10px;
  }

  #confirmPrograms {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  #confirmPrograms:hover:not(:disabled) {
    background: var(--primary-hover);
    transform: translateY(-1px);
  }

  #confirmPrograms:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .selection-count {
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .error {
    color: var(--danger);
    font-size: 14px;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.2);
    padding: 16px;
    border-radius: 12px;
  }

  .done-screen {
    text-align: center;
    padding: 20px 0;
  }

  .done-screen h1 {
    font-size: 28px;
    margin-bottom: 12px;
  }

  .done-screen p {
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .done-screen strong {
    color: var(--text-main);
  }

  .done-screen a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
    padding: 12px 24px;
    background: var(--primary);
    color: #fff;
    border-radius: 12px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .done-screen a:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
  }
</style>
</head>
<body>

<div class="app" id="app">
  <p style="color:var(--text-muted); font-size:14px;">Loading programs...</p>
</div>

<script>
  const API_BASE = "http://localhost:3000/api";
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get("sessionId");
  const studentId = params.get("studentId");

  // Require login — if there's no logged-in session at all, send them to auth.html
  if (!localStorage.getItem("studentId")) {
    window.location.href = "auth.html";
  }

  let programsData = [];
  let selectedIds = new Set();

  async function init() {
    const app = document.getElementById("app");

    if (!sessionId || !studentId) {
      app.innerHTML = `<p class="error">Missing session or student info. Please complete the interview first.</p>`;
      return;
    }

    const res = await fetch(`${API_BASE}/interview/${sessionId}/recommend-programs`);
    const data = await res.json();

    if (data.error) {
      app.innerHTML = `<p class="error">${data.error}</p>`;
      return;
    }

    programsData = data.programs;
    selectedIds = new Set(data.programs.filter(p => p.recommended).map(p => p.id));

    render(data.reasoning);
  }

  function render(reasoning) {
    const app = document.getElementById("app");

    const cards = programsData.map(p => `
      <div class="program-card ${selectedIds.has(p.id) ? 'selected' : ''}" data-id="${p.id}" onclick="toggle('${p.id}')">
        ${p.recommended ? '<div class="badge">Recommended for you</div>' : ''}
        <h3>${p.name}</h3>
        <p>${p.description}</p>
        <div class="concept-list">
          ${p.concepts.map(c => `<div>${c}</div>`).join("")}
        </div>
      </div>
    `).join("");

    app.innerHTML = `
      <h1>Choose Your Programs</h1>
      <div class="reasoning">${reasoning || "Pick any 2 programs to enroll in."}</div>
      ${cards}
      <div id="confirmBar">
        <div class="selection-count" id="selectionCount"></div>
        <button id="confirmPrograms" onclick="confirmSelection()">Confirm Selection</button>
      </div>
    `;

    updateState();
  }

  function toggle(id) {
    if (selectedIds.has(id)) {
      selectedIds.delete(id);
    } else {
      if (selectedIds.size >= 2) {
        const first = selectedIds.values().next().value;
        selectedIds.delete(first);
      }
      selectedIds.add(id);
    }
    document.querySelectorAll(".program-card").forEach(card => {
      card.classList.toggle("selected", selectedIds.has(card.dataset.id));
    });
    updateState();
  }

  function updateState() {
    document.getElementById("selectionCount").textContent = `${selectedIds.size} of 2 selected`;
    const btn = document.getElementById("confirmPrograms");
    btn.disabled = selectedIds.size !== 2;
  }

  async function confirmSelection() {
    if (selectedIds.size !== 2) return;

    const btn = document.getElementById("confirmPrograms");
    btn.disabled = true;
    btn.textContent = "Enrolling...";

    const selections = Array.from(selectedIds).map(id => {
      const program = programsData.find(p => p.id === id);
      return { programId: id, source: program.recommended ? "recommended" : "self_selected" };
    });

    const res = await fetch(`${API_BASE}/student/${studentId}/select-programs`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ selections }),
    });
    const data = await res.json();

    if (data.error) {
      alert("Error: " + data.error);
      btn.disabled = false;
      btn.textContent = "Confirm Selection";
      return;
    }

    document.getElementById("app").innerHTML = `
      <div class="done-screen">
        <h1>You're all set!</h1>
        <p>You've been enrolled in: <strong>${data.selections.map(s => s.program).join(", ")}</strong></p>
        <p style="color:var(--text-muted); font-size:14px;">Your mentor will guide you through each concept in your upcoming Zoom sessions.</p>
        <a href="dashboard.html?studentId=${studentId}">📊 View My Progress</a>
      </div>
    `;
  }

  init();
</script>

</body>
</html>
