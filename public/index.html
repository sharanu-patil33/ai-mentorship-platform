<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Interview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    --card-bg: rgba(30, 41, 59, 0.7);
    --card-border: rgba(255, 255, 255, 0.08);
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --primary-light: rgba(99, 102, 241, 0.15);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --ai-msg-bg: rgba(51, 65, 85, 0.6);
    --user-msg-bg: #6366f1;
    --danger: #ef4444;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-gradient);
    color: var(--text-main);
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .app {
    width: 100%;
    max-width: 720px;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
    height: 85vh;
    max-height: 800px;
    overflow: hidden;
    position: relative;
  }

  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(15, 23, 42, 0.4);
  }

  header .brand {
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  header .brand-badge {
    background: var(--primary-light);
    color: var(--primary);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    border: 1px solid rgba(99, 102, 241, 0.3);
  }

  header nav {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  header nav a {
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s;
  }

  header nav a:hover {
    color: var(--text-main);
  }

  #voiceToggleLabel {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    background: rgba(255, 255, 255, 0.05);
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid var(--card-border);
  }

  #voiceToggleLabel input[type="checkbox"] {
    accent-color: var(--primary);
    cursor: pointer;
  }

  /* Setup Screen */
  #setup {
    padding: 40px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex: 1;
    gap: 20px;
  }

  #welcomeMsg {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: -0.5px;
  }

  #setup p {
    font-size: 14px;
    color: var(--text-muted);
    max-width: 440px;
    line-height: 1.6;
    margin: 0;
  }

  .setup-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 320px;
    margin-top: 12px;
  }

  #setup button, #chat button, #programSelection button {
    padding: 12px 20px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  #setup button:hover, #chat button:hover, #programSelection button:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
  }

  .btn-logout {
    background: rgba(255, 255, 255, 0.05) !important;
    color: var(--text-muted) !important;
    border: 1px solid var(--card-border) !important;
  }

  .btn-logout:hover {
    background: rgba(255, 255, 255, 0.1) !important;
    color: var(--text-main) !important;
  }

  /* Chat Screen */
  #chat {
    display: none;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar {
    width: 6px;
  }

  #messages::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
  }

  .msg {
    max-width: 82%;
    padding: 12px 18px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.5;
    animation: fadeIn 0.25s ease-out;
    word-break: break-word;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.ai {
    background: var(--ai-msg-bg);
    color: var(--text-main);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    border: 1px solid var(--card-border);
  }

  .msg.user {
    background: var(--user-msg-bg);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
  }

  .topic-tag {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--primary);
    margin-bottom: 6px;
    display: inline-block;
    background: var(--primary-light);
    padding: 2px 8px;
    border-radius: 6px;
  }

  .voice-status {
    font-size: 12px;
    color: var(--primary);
    padding: 0 24px 8px;
    min-height: 20px;
    font-weight: 500;
  }

  #inputRow {
    display: flex;
    gap: 10px;
    padding: 16px 24px;
    border-top: 1px solid var(--card-border);
    background: rgba(15, 23, 42, 0.3);
    align-items: center;
  }

  #answerInput {
    flex: 1;
    padding: 12px 16px;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    font-size: 14px;
    color: var(--text-main);
    resize: none;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  #answerInput:focus {
    border-color: var(--primary);
  }

  #answerInput::placeholder {
    color: #64748b;
  }

  #micBtn {
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-main);
    border: 1px solid var(--card-border);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }

  #micBtn:hover {
    background: rgba(255, 255, 255, 0.15);
  }

  #micBtn.recording {
    background: var(--danger);
    color: #fff;
    border-color: transparent;
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
    70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  }

  .loading {
    color: var(--text-muted);
    font-size: 13px;
    padding: 8px 12px;
    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .loading-dots span {
    width: 6px;
    height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    display: inline-block;
    animation: bounce 1.4s infinite ease-in-out both;
  }

  .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
  .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  /* Summary Screen */
  #summary {
    display: none;
    padding: 32px;
    font-size: 14px;
    line-height: 1.6;
    overflow-y: auto;
    flex: 1;
  }

  #summary h2 {
    font-size: 22px;
    margin-top: 0;
    color: var(--text-main);
    border-bottom: 1px solid var(--card-border);
    padding-bottom: 12px;
  }

  #summary h3 {
    margin-top: 24px;
    font-size: 16px;
    color: var(--primary);
  }

  #summary ul {
    padding-left: 20px;
    color: var(--text-muted);
  }

  #summary li {
    margin-bottom: 6px;
  }

  #summary li strong {
    color: var(--text-main);
  }

  #programSelection {
    border-top: 1px solid var(--card-border);
    background: rgba(15, 23, 42, 0.4);
  }

  .program-card {
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.03);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .program-card:hover {
    border-color: var(--primary);
    background: rgba(99, 102, 241, 0.05);
  }

  .program-card.selected {
    border-color: var(--primary);
    background: var(--primary-light);
  }

  .program-card .badge {
    display: inline-block;
    font-size: 11px;
    background: var(--primary);
    color: #fff;
    padding: 2px 8px;
    border-radius: 10px;
    margin-bottom: 6px;
  }

  .program-card h4 { margin: 0 0 4px; color: var(--text-main); }
  .program-card p { margin: 0; font-size: 13px; color: var(--text-muted); }

  #confirmPrograms:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      AI Interview
      <span class="brand-badge">Live</span>
    </div>
    <nav>
      <a href="dashboard.html">My Progress</a>
      <label id="voiceToggleLabel">
        <input type="checkbox" id="voiceToggle" checked />
        Voice Mode
      </label>
    </nav>
  </header>

  <div id="setup">
    <div id="welcomeMsg">Welcome!</div>
    <p>Click below to begin your AI interview. The interviewer will guide you through introduction, past projects, hobbies, and technical questions.</p>
    <div class="setup-actions">
      <button onclick="startInterview()">Start Interview &rarr;</button>
      <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>
  </div>

  <div id="chat">
    <div id="messages"></div>
    <div class="voice-status" id="voiceStatus"></div>
    <div id="inputRow">
      <button id="micBtn" onclick="toggleRecording()" title="Click to speak">🎤</button>
      <textarea id="answerInput" rows="1" placeholder="Type your answer, or click the mic to speak..."></textarea>
      <button onclick="submitAnswer()">Send</button>
    </div>
  </div>

  <div id="summary"></div>
  <div id="programSelection" style="display:none; padding:20px; overflow-y:auto;"></div>
</div>

<script>
  const API_BASE = "http://localhost:3000/api";
  let sessionId = null;
  let currentQuestion = null;
  let studentId = null;
  let studentName = null;

  // Require login — redirect if no session found
  studentId = localStorage.getItem("studentId");
  studentName = localStorage.getItem("studentName");

  if (!studentId) {
    localStorage.removeItem("studentId");
    localStorage.removeItem("studentName");
    window.location.href = "auth.html";
  } else {
    document.getElementById("welcomeMsg").textContent = `Welcome back, ${studentName || "there"}!`;
  }

  function logout() {
    localStorage.removeItem("studentId");
    localStorage.removeItem("studentName");
    window.location.href = "auth.html";
  }

  // ---------- Voice setup ----------
  const voiceToggle = document.getElementById("voiceToggle");
  const micBtn = document.getElementById("micBtn");
  const voiceStatus = document.getElementById("voiceStatus");

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isRecording = false;

  let lastTranscript = "";
  let userStoppedManually = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = true; // keep listening through natural pauses
    recognition.interimResults = true;
    recognition.lang = "en-US";

    recognition.onstart = () => {
      isRecording = true;
      micBtn.classList.add("recording");
      voiceStatus.textContent = "Listening... click mic again when you're done";
    };

    recognition.onresult = (event) => {
      let transcript = "";
      for (let i = 0; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      document.getElementById("answerInput").value = transcript;
      lastTranscript = transcript.trim();
    };

    recognition.onerror = (event) => {
      if (event.error !== "no-speech") {
        voiceStatus.textContent = "Mic error: " + event.error;
        stopRecording();
      }
    };

    recognition.onend = () => {
      const wasManualStop = userStoppedManually;
      stopRecording();
      if (wasManualStop && lastTranscript) {
        voiceStatus.textContent = "Answer captured, sending...";
        submitAnswer();
        lastTranscript = "";
      }
      userStoppedManually = false;
    };
  } else {
    micBtn.style.display = "none";
  }

  function toggleRecording() {
    if (!recognition) return;
    if (isRecording) {
      userStoppedManually = true;
      recognition.stop();
    } else {
      document.getElementById("answerInput").value = "";
      lastTranscript = "";
      userStoppedManually = false;
      recognition.start();
    }
  }

  function stopRecording() {
    isRecording = false;
    micBtn.classList.remove("recording");
    voiceStatus.textContent = "";
  }

  function speak(text) {
    if (!voiceToggle.checked) return;
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel(); // stop any prior speech
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1.0;
    utterance.pitch = 1.0;
    window.speechSynthesis.speak(utterance);
  }

  // ---------- Chat logic ----------
  function addMessage(text, sender, topic) {
    const messages = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "msg " + sender;
    if (topic && sender === "ai") {
      div.innerHTML = `<div class="topic-tag">${topic}</div><div>${text}</div>`;
    } else {
      div.textContent = text;
    }
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function showLoading(show) {
    let el = document.getElementById("loadingMsg");
    if (show && !el) {
      el = document.createElement("div");
      el.id = "loadingMsg";
      el.className = "loading";
      el.innerHTML = `
        AI is thinking 
        <div class="loading-dots">
          <span></span><span></span><span></span>
        </div>
      `;
      document.getElementById("messages").appendChild(el);
      document.getElementById("messages").scrollTop = 999999;
    } else if (!show && el) {
      el.remove();
    }
  }

  async function startInterview() {
    document.getElementById("setup").style.display = "none";
    document.getElementById("chat").style.display = "flex";
    showLoading(true);

    const res = await fetch(`${API_BASE}/interview/start`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ studentId, knownTopics: [] }),
    });
    const data = await res.json();
    showLoading(false);

    if (data.error) {
      addMessage("Error: " + data.error, "ai");
      return;
    }

    sessionId = data.sessionId;
    currentQuestion = data.question;
    addMessage(data.question, "ai", data.topic);
    speak(data.question);
  }

  async function submitAnswer() {
    const input = document.getElementById("answerInput");
    const answer = input.value.trim();
    if (!answer) return;

    addMessage(answer, "user");
    input.value = "";
    voiceStatus.textContent = "";
    showLoading(true);

    const res = await fetch(`${API_BASE}/interview/answer`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId, question: currentQuestion, answer }),
    });
    const data = await res.json();
    showLoading(false);

    if (data.error) {
      addMessage("Error: " + data.error, "ai");
      return;
    }

    if (data.done) {
      document.getElementById("chat").style.display = "none";
      renderSummary(data.summary);
      speak("The interview is complete. Here is your summary.");
      showViewProgramsButton();
      return;
    }

    currentQuestion = data.question;
    addMessage(data.question, "ai", data.topic);
    speak(data.question);
  }

  function renderSummary(summary) {
    const el = document.getElementById("summary");
    el.style.display = "block";

    const topicScores = Object.entries(summary.topic_scores || {})
      .map(([topic, score]) => `<li><strong>${topic}:</strong> ${score}</li>`)
      .join("");

    const strengths = (summary.strengths || []).map(s => `<li>${s}</li>`).join("");
    const weaknesses = (summary.weaknesses || []).map(w => `<li>${w}</li>`).join("");

    el.innerHTML = `
      <h2>Interview Summary</h2>
      <p>${summary.overall_summary || ""}</p>
      <h3>Topic Scores</h3>
      <ul>${topicScores}</ul>
      <h3>Strengths</h3>
      <ul>${strengths}</ul>
      <h3>Areas to Improve</h3>
      <ul>${weaknesses}</ul>
    `;
  }

  document.getElementById("answerInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submitAnswer();
    }
  });

  function showViewProgramsButton() {
    const el = document.getElementById("programSelection");
    el.style.display = "block";
    el.innerHTML = `
      <button onclick="goToPrograms()" style="width:100%; padding:14px; font-size:15px;">
        View All Program Details →
      </button>
    `;
  }

  function goToPrograms() {
    window.location.href = `programs.html?sessionId=${sessionId}&studentId=${studentId}`;
  }
</script>

</body>
</html>
