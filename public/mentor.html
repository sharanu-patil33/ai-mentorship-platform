<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mentor Dashboard - Student Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    --card-bg: rgba(30, 41, 59, 0.7);
    --card-border: rgba(255, 255, 255, 0.08);
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --primary-light: rgba(99, 102, 241, 0.15);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --success: #10b981;
    --success-light: rgba(16, 185, 129, 0.15);
    --warning: #f59e0b;
    --warning-light: rgba(245, 158, 11, 0.15);
    --danger: #ef4444;
    --danger-light: rgba(239, 68, 68, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-gradient);
    color: var(--text-main);
    min-height: 100vh;
    padding: 36px 20px 60px;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 800px;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    padding: 36px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--card-border);
  }

  header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: var(--text-main);
  }

  header a {
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s;
  }

  header a:hover {
    color: var(--text-main);
  }

  #searchRow {
    display: flex;
    gap: 12px;
    margin-bottom: 28px;
  }

  #searchRow input {
    flex: 1;
    padding: 12px 16px;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    font-size: 14px;
    color: var(--text-main);
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  #searchRow input:focus {
    border-color: var(--primary);
  }

  #searchRow input::placeholder {
    color: #64748b;
  }

  #searchRow button {
    padding: 12px 24px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  #searchRow button:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
  }

  .student-header {
    padding: 20px;
    background: rgba(15, 23, 42, 0.5);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    margin-bottom: 24px;
    font-size: 15px;
  }

  .student-header strong {
    color: var(--text-main);
    font-size: 17px;
  }

  .program-block {
    border: 1px solid var(--card-border);
    background: rgba(255, 255, 255, 0.02);
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  }

  .program-block h3 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text-main);
    letter-spacing: -0.3px;
  }

  .program-status {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-muted);
    border: 1px solid var(--card-border);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .program-status.completed {
    background: var(--success-light);
    color: var(--success);
    border-color: rgba(16, 185, 129, 0.3);
  }

  .concept-full {
    display: flex;
    flex-direction: column;
    width: 100%;
    padding: 16px 12px;
    border-top: 1px solid var(--card-border);
    border-radius: 12px;
    transition: background-color 0.4s ease;
  }

  .concept-full:first-of-type {
    border-top: none;
  }

  .concept-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .concept-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-main);
    flex: 1;
  }

  select.status-select {
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid var(--card-border);
    color: var(--text-main);
    font-size: 13px;
    outline: none;
    font-family: inherit;
    cursor: pointer;
  }

  select.status-select:focus {
    border-color: var(--primary);
  }

  textarea.notes-input {
    width: 100%;
    margin-top: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--card-border);
    color: var(--text-main);
    font-size: 13px;
    resize: vertical;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea.notes-input:focus {
    border-color: var(--primary);
  }

  textarea.notes-input::placeholder {
    color: #64748b;
  }

  .error {
    color: var(--danger);
    font-size: 14px;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.2);
    padding: 14px 18px;
    border-radius: 12px;
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Student Progress</h1>
    <a href="mentor-dashboard.html">← Back to Dashboard</a>
  </header>

  <div id="searchRow">
    <input id="emailInput" placeholder="Student email" />
    <button onclick="searchStudent()">Search</button>
  </div>

  <div id="result"></div>
</div>

<script>
  const API_BASE = "http://localhost:3000/api";

  // Require mentor login
  if (!localStorage.getItem("mentorId")) {
    window.location.href = "mentor-auth.html";
  }

  // Auto-load if email passed via URL param (from mentor-dashboard.html)
  const params = new URLSearchParams(window.location.search);
  if (params.get("email")) {
    document.getElementById("emailInput").value = params.get("email");
    searchStudent();
  }

  async function searchStudent() {
    const email = document.getElementById("emailInput").value.trim();
    const resultEl = document.getElementById("result");
    if (!email) return;

    resultEl.innerHTML = "<p style='color:var(--text-muted); font-size:14px;'>Loading student details...</p>";

    const res = await fetch(`${API_BASE}/mentor/student?email=${encodeURIComponent(email)}`);
    const data = await res.json();

    if (data.error) {
      resultEl.innerHTML = `<p class="error">${data.error}</p>`;
      return;
    }

    renderStudent(data);
  }

  function renderStudent(data) {
    const resultEl = document.getElementById("result");

    const header = `
      <div class="student-header">
        <strong>${data.student.name}</strong> — <span style="color:var(--text-muted);">${data.student.email}</span><br/>
        <span style="font-size:13px; color:var(--text-muted); margin-top:6px; display:inline-block;">
          <b>Known topics:</b> ${(data.student.known_topics || []).join(", ") || "None listed"}
        </span>
      </div>
    `;

    if (!data.programs.length) {
      resultEl.innerHTML = header + "<p style='color:var(--text-muted); font-size:14px;'>No programs selected yet.</p>";
      return;
    }

    const programBlocks = data.programs.map(p => `
      <div class="program-block">
        <h3>${p.programName} <span class="program-status ${p.status}">${p.status.replace('_', ' ')}</span></h3>
        <div class="source" style="font-size:12px; color:var(--text-muted); margin-bottom:14px;">${p.source === 'recommended' ? 'AI recommended' : 'Self-selected'}</div>
        ${p.concepts.map(c => `
          <div class="concept-full" data-concept-id="${c.id}">
            <div class="concept-top-row">
              <span class="concept-name">${c.concept_name}</span>
              <select class="status-select" onchange="updateConcept('${c.id}', this.value, null)">
                <option value="not_started" ${c.status === 'not_started' ? 'selected' : ''}>Not started</option>
                <option value="in_progress" ${c.status === 'in_progress' ? 'selected' : ''}>In progress</option>
                <option value="completed" ${c.status === 'completed' ? 'selected' : ''}>Completed</option>
                <option value="needs_review" ${c.status === 'needs_review' ? 'selected' : ''}>Needs review</option>
              </select>
            </div>
            <textarea class="notes-input" rows="1" placeholder="Mentor notes..."
              onblur="updateConcept('${c.id}', null, this.value)">${c.mentor_notes || ''}</textarea>
          </div>
        `).join("")}
      </div>
    `).join("");

    resultEl.innerHTML = header + programBlocks;
  }

  async function updateConcept(conceptId, status, mentorNotes) {
    const body = {};
    if (status !== null) body.status = status;
    if (mentorNotes !== null) body.mentorNotes = mentorNotes;

    const res = await fetch(`${API_BASE}/mentor/concept-progress/${conceptId}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();

    if (data.error) {
      alert("Error saving: " + data.error);
      return;
    }

    // Quick visual confirmation feedback
    const row = document.querySelector(`[data-concept-id="${conceptId}"]`);
    if (row) {
      row.style.backgroundColor = "rgba(16, 185, 129, 0.15)";
      setTimeout(() => { row.style.backgroundColor = ""; }, 600);
    }
  }
</script>

</body>
</html>
