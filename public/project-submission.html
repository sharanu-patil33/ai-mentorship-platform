<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Submission</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #f5f5f7; }
  .container { max-width: 720px; margin: 0 auto; padding: 28px 20px; }
  a.back { font-size: 13px; color: #666; text-decoration: none; }
  h1 { font-size: 22px; margin: 12px 0 20px; }
  .box { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .box h3 { font-size: 16px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: #555; margin: 10px 0 4px; }
  input[type=text], input[type=url] { width: 100%; padding: 9px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  button { background: #111; color: #fff; border: 0; padding: 11px 22px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .msg { font-size: 13px; margin-top: 12px; }
  .err { color: #c92a2a; } .ok { color: #2b8a3e; }
  .badge { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 10px; margin-bottom: 8px; }
  .submitted { background: #fff3bf; color: #e67700; }
  .approved { background: #d3f9d8; color: #2b8a3e; }
  .changes_requested { background: #ffe3e3; color: #c92a2a; }
</style>
</head>
<body>
<div class="container">
  <a class="back" href="student-dashboard.html">← Back to dashboard</a>
  <h1>Project Submission</h1>
  <div id="content">Loading...</div>
</div>

<script>
  const API_BASE = "http://localhost:3000/api";
  const studentId = localStorage.getItem("studentId");
  if (!studentId) window.location.href = "auth.html";

  const content = document.getElementById("content");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  async function load() {
    const res = await fetch(`${API_BASE}/student/${studentId}/submissions`);
    const { programs } = await res.json();

    if (programs.length !== 2) {
      content.innerHTML = "<p>Enroll in 2 programs first.</p>";
      return;
    }

    const allSubmitted = programs.every((p) => p.submission);
    const canEdit = !allSubmitted || programs.some((p) => p.submission.status === "changes_requested");

    // Read-only status view
    let html = "";
    if (allSubmitted) {
      html += programs.map((p) => `
        <div class="box">
          <h3>${esc(p.programName)}</h3>
          <span class="badge ${p.submission.status}">${p.submission.status.replace("_", " ")}</span>
          <p style="font-size:13px">PDF: ${esc(p.submission.pdf_name)}</p>
          <p style="font-size:13px">Repo: <a href="${esc(p.submission.repo_url)}" target="_blank" rel="noopener">${esc(p.submission.repo_url)}</a></p>
          ${p.submission.mentor_feedback ? `<p style="font-size:13px;margin-top:8px"><b>Mentor feedback:</b> ${esc(p.submission.mentor_feedback)}</p>` : ""}
        </div>`).join("");
    }
    if (!canEdit) { content.innerHTML = html; return; }

    // Upload form
    html += `<form id="form">` + programs.map((p, i) => `
      <div class="box">
        <h3>${esc(p.programName)}</h3>
        <input type="hidden" name="studentProgramId_${i + 1}" value="${esc(p.studentProgramId)}" />
        <label>Course PDF (max 10 MB)</label>
        <input type="file" name="pdf_${i + 1}" accept="application/pdf" required />
        <label>Project repository link</label>
        <input type="url" name="repoUrl_${i + 1}" placeholder="https://github.com/you/project" required />
      </div>`).join("") +
      `<button type="submit" id="submitBtn">${allSubmitted ? "Resubmit" : "Submit Projects"}</button>
       <p class="msg" id="msg"></p></form>`;
    content.innerHTML = html;

    document.getElementById("form").addEventListener("submit", onSubmit);
  }

  async function onSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");
    btn.disabled = true; msg.className = "msg"; msg.textContent = "Uploading...";

    try {
      const res = await fetch(`${API_BASE}/student/${studentId}/submissions`, {
        method: "POST",
        body: new FormData(e.target), // browser sets multipart headers itself
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Submission failed");
      msg.className = "msg ok"; msg.textContent = "Submitted!";
      setTimeout(load, 800);
    } catch (err) {
      msg.className = "msg err"; msg.textContent = err.message;
      btn.disabled = false;
    }
  }

  load();
</script>
</body>
</html>
