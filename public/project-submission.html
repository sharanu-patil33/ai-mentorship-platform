<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Submission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    --card-bg: rgba(30, 41, 59, 0.7);
    --card-border: rgba(255, 255, 255, 0.08);
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --primary-light: rgba(99, 102, 241, 0.15);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --success: #10b981;
    --success-light: rgba(16, 185, 129, 0.15);
    --warning: #f59e0b;
    --warning-light: rgba(245, 158, 11, 0.15);
    --danger: #ef4444;
    --danger-light: rgba(239, 68, 68, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-gradient);
    color: var(--text-main);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  header {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--card-border);
    padding: 18px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  a.back {
    color: var(--text-muted);
    font-size: 13px;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s;
  }

  a.back:hover {
    color: var(--text-main);
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 36px 24px;
  }

  .page-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 24px;
  }

  .box {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
  }

  .box h3 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 16px;
    color: var(--text-main);
    letter-spacing: -0.3px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    margin: 14px 0 6px;
  }

  input[type=text], input[type=url] {
    width: 100%;
    padding: 12px 16px;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    font-size: 14px;
    color: var(--text-main);
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  input[type=text]:focus, input[type=url]:focus {
    border-color: var(--primary);
  }

  input[type=file] {
    width: 100%;
    padding: 10px;
    background: rgba(15, 23, 42, 0.6);
    border: 1px dashed var(--card-border);
    border-radius: 12px;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
  }

  input[type=file]::-webkit-file-upload-button {
    background: var(--primary-light);
    color: var(--primary);
    border: 1px solid rgba(99, 102, 241, 0.3);
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    margin-right: 12px;
  }

  button {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    margin-top: 8px;
  }

  button:hover:not(:disabled) {
    background: var(--primary-hover);
    transform: translateY(-1px);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .msg {
    font-size: 13px;
    margin-top: 14px;
    text-align: center;
    font-weight: 500;
  }

  .err { color: var(--danger); } 
  .ok { color: var(--success); }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .submitted {
    background: var(--warning-light);
    color: var(--warning);
    border: 1px solid rgba(245, 158, 11, 0.3);
  }

  .approved {
    background: var(--success-light);
    color: var(--success);
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .changes_requested {
    background: var(--danger-light);
    color: var(--danger);
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  .box a {
    color: var(--primary);
    text-decoration: none;
    word-break: break-all;
  }

  .box a:hover {
    text-decoration: underline;
  }

  .feedback-box {
    margin-top: 12px;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.03);
    border-left: 3px solid var(--primary);
    border-radius: 0 8px 8px 0;
    font-size: 13px;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<header>
  <h1>🗂️ Project Submission</h1>
  <a class="back" href="student-dashboard.html">← Back to Dashboard</a>
</header>

<div class="container">
  <div class="page-title">Submit Program Projects</div>
  <div id="content" style="color: var(--text-muted); font-size: 14px;">Loading...</div>
</div>

<script>
  const API_BASE = "http://localhost:3000/api";
  const studentId = localStorage.getItem("studentId");
  if (!studentId) window.location.href = "auth.html";

  const content = document.getElementById("content");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  async function load() {
    const res = await fetch(`${API_BASE}/student/${studentId}/submissions`);
    const { programs } = await res.json();

    if (programs.length !== 2) {
      content.innerHTML = "<p>Enroll in 2 programs first.</p>";
      return;
    }

    const allSubmitted = programs.every((p) => p.submission);
    const canEdit = !allSubmitted || programs.some((p) => p.submission.status === "changes_requested");

    // Read-only status view
    let html = "";
    if (allSubmitted) {
      html += programs.map((p) => `
        <div class="box">
          <h3>${esc(p.programName)}</h3>
          <span class="badge ${p.submission.status}">${p.submission.status.replace("_", " ")}</span>
          <p style="font-size:13px; color:var(--text-muted); margin-bottom:6px;"><b>PDF:</b> ${esc(p.submission.pdf_name)}</p>
          <p style="font-size:13px; color:var(--text-muted);"><b>Repo:</b> <a href="${esc(p.submission.repo_url)}" target="_blank" rel="noopener">${esc(p.submission.repo_url)}</a></p>
          ${p.submission.mentor_feedback ? `<div class="feedback-box"><b>Mentor feedback:</b> ${esc(p.submission.mentor_feedback)}</div>` : ""}
        </div>`).join("");
    }
    if (!canEdit) { content.innerHTML = html; return; }

    // Upload form
    html += `<form id="form">` + programs.map((p, i) => `
      <div class="box">
        <h3>${esc(p.programName)}</h3>
        <input type="hidden" name="studentProgramId_${i + 1}" value="${esc(p.studentProgramId)}" />
        <label>Course PDF (max 10 MB)</label>
        <input type="file" name="pdf_${i + 1}" accept="application/pdf" required />
        <label>Project repository link</label>
        <input type="url" name="repoUrl_${i + 1}" placeholder="https://github.com/you/project" required />
      </div>`).join("") +
      `<button type="submit" id="submitBtn">${allSubmitted ? "Resubmit" : "Submit Projects"}</button>
       <p class="msg" id="msg"></p></form>`;
    content.innerHTML = html;

    document.getElementById("form").addEventListener("submit", onSubmit);
  }

  async function onSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("msg");
    btn.disabled = true; msg.className = "msg"; msg.textContent = "Uploading...";

    try {
      const res = await fetch(`${API_BASE}/student/${studentId}/submissions`, {
        method: "POST",
        body: new FormData(e.target), // browser sets multipart headers itself
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Submission failed");
      msg.className = "msg ok"; msg.textContent = "Submitted!";
      setTimeout(load, 800);
    } catch (err) {
      msg.className = "msg err"; msg.textContent = err.message;
      btn.disabled = false;
    }
  }

  load();
</script>
</body>
</html>
