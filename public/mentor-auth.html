<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mentor Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    --card-bg: rgba(30, 41, 59, 0.7);
    --card-border: rgba(255, 255, 255, 0.08);
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --primary-light: rgba(99, 102, 241, 0.15);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --success: #10b981;
    --success-light: rgba(16, 185, 129, 0.15);
    --danger: #ef4444;
    --danger-light: rgba(239, 68, 68, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-gradient);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    padding: 40px 32px;
    text-align: center;
  }

  .logo {
    font-size: 38px;
    width: 72px;
    height: 72px;
    background: var(--primary-light);
    border: 1px solid rgba(99, 102, 241, 0.3);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: var(--text-main);
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 28px;
  }

  input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    font-size: 14px;
    color: var(--text-main);
    outline: none;
    font-family: inherit;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: var(--primary);
  }

  input::placeholder {
    color: #64748b;
  }

  button {
    width: 100%;
    padding: 13px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  button:hover:not(:disabled) {
    background: var(--primary-hover);
    transform: translateY(-1px);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .msg {
    font-size: 13px;
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    text-align: left;
    font-weight: 500;
  }

  .msg.error {
    background: var(--danger-light);
    color: var(--danger);
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  .msg.success {
    background: var(--success-light);
    color: var(--success);
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .student-link {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .student-link a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
  }

  .student-link a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">🎓</div>
  <h1>Mentor Portal</h1>
  <p class="subtitle">Sign in with your mentor credentials</p>
  <input id="email" type="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />
  <button id="loginBtn" onclick="login()">Sign In</button>
  <div id="messageBox"></div>
  <div class="student-link">Are you a student? <a href="auth.html">Sign in here</a></div>
</div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
  const SUPABASE_URL = "https://mqlndwyxmscfbcoesgfj.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_p8TSdcMAwNOJg7KfipITaA_vvxXkA1x";
  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  const API_BASE = "http://localhost:3000/api";

  function showMessage(text, type) {
    document.getElementById("messageBox").innerHTML = `<div class="msg ${type}">${text}</div>`;
  }

  window.login = async function () {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("loginBtn");
    if (!email || !password) { showMessage("Please fill in all fields", "error"); return; }
    btn.disabled = true; btn.textContent = "Signing in...";
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) { showMessage(error.message, "error"); btn.disabled = false; btn.textContent = "Sign In"; return; }
    const res = await fetch(`${API_BASE}/auth/sync-mentor`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ authUserId: data.user.id, email: data.user.email }),
    });
    const mentorData = await res.json();
    if (mentorData.error) {
      await supabase.auth.signOut();
      showMessage(mentorData.error, "error");
      btn.disabled = false; btn.textContent = "Sign In"; return;
    }
    localStorage.setItem("mentorId", mentorData.mentor.id);
    localStorage.setItem("mentorName", mentorData.mentor.name);
    window.location.href = "mentor-dashboard.html";
  };
</script>

</body>
</html>
