<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mentor Login</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f7;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 32px;
  }
  .logo { font-size: 28px; margin-bottom: 8px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 24px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 11px;
    background: #1a1a2e;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }
  button:disabled { background: #ccc; cursor: not-allowed; }
  .msg { font-size: 13px; margin-top: 12px; padding: 10px 12px; border-radius: 8px; }
  .msg.error { background: #ffe3e3; color: #c92a2a; }
  .msg.success { background: #d3f9d8; color: #2b8a3e; }
  .student-link { text-align: center; margin-top: 16px; font-size: 13px; color: #888; }
  .student-link a { color: #555; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🎓</div>
  <h1>Mentor Portal</h1>
  <p class="subtitle">Sign in with your mentor credentials</p>
  <input id="email" type="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />
  <button id="loginBtn" onclick="login()">Sign In</button>
  <div id="messageBox"></div>
  <div class="student-link">Are you a student? <a href="auth.html">Sign in here</a></div>
</div>
<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
  const SUPABASE_URL = "https://mqlndwyxmscfbcoesgfj.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_p8TSdcMAwNOJg7KfipITaA_vvxXkA1x";
  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  const API_BASE = "http://localhost:3000/api";
  function showMessage(text, type) {
    document.getElementById("messageBox").innerHTML = `<div class="msg ${type}">${text}</div>`;
  }
  window.login = async function () {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("loginBtn");
    if (!email || !password) { showMessage("Please fill in all fields", "error"); return; }
    btn.disabled = true; btn.textContent = "Signing in...";
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) { showMessage(error.message, "error"); btn.disabled = false; btn.textContent = "Sign In"; return; }
    const res = await fetch(`${API_BASE}/auth/sync-mentor`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ authUserId: data.user.id, email: data.user.email }),
    });
    const mentorData = await res.json();
    if (mentorData.error) {
      await supabase.auth.signOut();
      showMessage(mentorData.error, "error");
      btn.disabled = false; btn.textContent = "Sign In"; return;
    }
    localStorage.setItem("mentorId", mentorData.mentor.id);
    localStorage.setItem("mentorName", mentorData.mentor.name);
    window.location.href = "mentor-dashboard.html";
  };
</script>
</body>
</html>
