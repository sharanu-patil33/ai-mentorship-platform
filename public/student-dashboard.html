<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    --card-bg: rgba(30, 41, 59, 0.7);
    --card-border: rgba(255, 255, 255, 0.08);
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --primary-light: rgba(99, 102, 241, 0.15);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --success: #10b981;
    --success-light: rgba(16, 185, 129, 0.15);
    --warning: #f59e0b;
    --warning-light: rgba(245, 158, 11, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-gradient);
    color: var(--text-main);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  header {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--card-border);
    padding: 18px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-info {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 16px;
    font-weight: 500;
  }

  .logout-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--card-border);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .logout-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    color: var(--text-main);
    border-color: rgba(255, 255, 255, 0.2);
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 36px 24px;
  }

  .welcome {
    margin-bottom: 28px;
  }

  .welcome h2 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .welcome p {
    font-size: 14px;
    color: var(--text-muted);
  }

  /* Progress Status Bar */
  .status-bar {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 20px 16px;
    margin-bottom: 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    overflow-x: auto;
  }

  .step {
    flex: 1;
    text-align: center;
    padding: 6px 4px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    position: relative;
    min-width: 100px;
    transition: all 0.2s;
  }

  .step-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    border: 2px solid rgba(15, 23, 42, 0.8);
    margin: 0 auto 8px;
    transition: all 0.2s;
  }

  .step.done {
    color: var(--success);
  }

  .step.done .step-dot {
    background: var(--success);
    box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
  }

  .step.active {
    color: var(--text-main);
    font-weight: 700;
  }

  .step.active .step-dot {
    background: var(--primary);
    box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
    transform: scale(1.25);
  }

  /* Grid Layout */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    gap: 12px;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    text-decoration: none;
    color: inherit;
    position: relative;
    overflow: hidden;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: rgba(99, 102, 241, 0.4);
    box-shadow: 0 16px 36px rgba(0,0,0,0.3);
  }

  .card.locked {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
    filter: grayscale(0.2);
  }

  .card.completed {
    border-color: rgba(16, 185, 129, 0.3);
  }

  .card-icon {
    font-size: 30px;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    border: 1px solid var(--card-border);
  }

  .card-title {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-main);
    letter-spacing: -0.2px;
  }

  .card-desc {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
    flex: 1;
  }

  .card-status {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    display: inline-block;
    width: fit-content;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-top: 4px;
  }

  .status-done {
    background: var(--success-light);
    color: var(--success);
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .status-pending {
    background: var(--warning-light);
    color: var(--warning);
    border: 1px solid rgba(245, 158, 11, 0.3);
  }

  .status-locked {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-muted);
    border: 1px solid var(--card-border);
  }

  .status-active {
    background: var(--primary-light);
    color: var(--primary);
    border: 1px solid rgba(99, 102, 241, 0.3);
  }
</style>
</head>
<body>

<header>
  <h1>AI Mentorship Platform</h1>
  <div class="user-info">
    <span id="headerName">Loading...</span>
    <button class="logout-btn" onclick="logout()">Log Out</button>
  </div>
</header>

<div class="container">
  <div class="welcome">
    <h2 id="welcomeMsg">Welcome!</h2>
    <p id="welcomeSub">Here's your learning journey at a glance.</p>
  </div>

  <div class="status-bar" id="statusBar">
    <div class="step" id="step1"><div class="step-dot"></div>AI Interview</div>
    <div class="step" id="step2"><div class="step-dot"></div>Choose Programs</div>
    <div class="step" id="step3"><div class="step-dot"></div>Learn & Practice</div>
    <div class="step" id="step4"><div class="step-dot"></div>Submit Projects</div>
    <div class="step" id="step5"><div class="step-dot"></div>Final Interview</div>
    <div class="step" id="step6"><div class="step-dot"></div>Resume & Jobs</div>
  </div>

  <div class="grid" id="cardsGrid">
    <p style="color:var(--text-muted); font-size:14px; grid-column: span 2;">Loading your dashboard...</p>
  </div>
</div>

<script>
  const API_BASE = "http://localhost:3000/api";

  const studentId = localStorage.getItem("studentId");
  const studentName = localStorage.getItem("studentName");

  if (!studentId) {
    localStorage.removeItem("studentId");
    localStorage.removeItem("studentName");
    window.location.href = "auth.html";
  }

  document.getElementById("headerName").textContent = studentName || "Student";
  document.getElementById("welcomeMsg").textContent = `Welcome back, ${studentName || "there"}!`;

  function logout() {
    localStorage.removeItem("studentId");
    localStorage.removeItem("studentName");
    window.location.href = "auth.html";
  }

    async function loadDashboard() {
    const [interviewRes, dashRes, projRes, finalRes] = await Promise.all([
      fetch(`${API_BASE}/student/${studentId}/interview-status`),
      fetch(`${API_BASE}/student/${studentId}/dashboard`),
      fetch(`${API_BASE}/student/${studentId}/projects`),
      fetch(`${API_BASE}/final-interview/${studentId}/result`),
    ]);

    const interviewData = await interviewRes.json();
    const dashData = await dashRes.json();
    const projData = await projRes.json();
    const finalData = await finalRes.json();

    const hasInterview = interviewData.hasCompletedInterview;
    const sessionId = interviewData.sessionId;
    const hasPrograms = dashData.programs && dashData.programs.length > 0;
    const completedConcepts = hasPrograms && dashData.programs.every(p => p.status === "completed");
    const projects = projData.projects || [];
    const hasProjects = projects.length > 0;
    const approvedProjects = projects.filter(p => p.status === "approved").length;
    const hasFinalInterview = finalData.exists;

    if (hasInterview) markStep("step1", "done"); else markStep("step1", "active");
    if (hasPrograms) markStep("step2", "done"); else if (hasInterview) markStep("step2", "active");
    if (hasPrograms) markStep("step3", completedConcepts ? "done" : "active");
    if (hasProjects) markStep("step4", approvedProjects >= 2 ? "done" : "active"); else if (hasPrograms) markStep("step4", "active");
    if (hasFinalInterview) markStep("step5", "done"); else if (hasProjects) markStep("step5", "active");
    if (hasFinalInterview) markStep("step6", "active");

    renderCards(hasInterview, hasPrograms, dashData, sessionId, projects, hasFinalInterview);
  }

  function markStep(id, state) {
    const el = document.getElementById(id);
    el.className = "step " + (state === "done" ? "done" : state === "active" ? "active" : "");
  }

  function renderCards(hasInterview, hasPrograms, data, sessionId, projects, hasFinalInterview) {
    const grid = document.getElementById("cardsGrid");
    const hasProjects = projects.length > 0;
    const approvedCount = projects.filter(p => p.status === "approved").length;

    const cards = [
      {
        icon: "🎙️",
        title: "AI Interview",
        desc: hasInterview ? "Initial interview completed." : "Start your AI-powered viva to assess your knowledge.",
        status: hasInterview ? "done" : "active",
        statusLabel: hasInterview ? "✓ Completed" : "Start Now",
        href: "index.html",
        locked: false,
      },
      {
        icon: "📚",
        title: "Choose Programs",
        desc: hasPrograms ? `Enrolled in: ${data.programs.map(p => p.programName).join(", ")}` : "Pick 2 programs based on your interview results.",
        status: hasPrograms ? "done" : hasInterview ? "pending" : "locked",
        statusLabel: hasPrograms ? "✓ Enrolled" : hasInterview ? "Choose Now" : "Complete interview first",
        href: hasInterview && !hasPrograms ? `programs.html?sessionId=${sessionId}&studentId=${studentId}` : "#",
        locked: !hasInterview || hasPrograms,
      },
      {
        icon: "📈",
        title: "My Progress",
        desc: hasPrograms ? "Track your concept progress across your enrolled programs." : "Enroll in programs first.",
        status: hasPrograms ? "pending" : "locked",
        statusLabel: hasPrograms ? "View Progress" : "Locked",
        href: "dashboard.html",
        locked: !hasPrograms,
      },
      {
        icon: "💬",
        title: "Discourse & Zoom",
        desc: "Join your mentor's sessions, ask questions, and collaborate with peers.",
        status: hasPrograms ? "active" : "locked",
        statusLabel: hasPrograms ? "Join Session" : "Locked",
        href: "#",
        locked: !hasPrograms,
      },
      {
        icon: "🗂️",
        title: "Project Submission",
        desc: hasProjects ? `${projects.length} submitted · ${approvedCount} approved` : "Submit your program projects for mentor review.",
        status: approvedCount >= 2 ? "done" : hasProjects ? "pending" : hasPrograms ? "active" : "locked",
        statusLabel: approvedCount >= 2 ? "✓ Both Approved" : hasProjects ? `${approvedCount}/2 Approved` : hasPrograms ? "Submit Project" : "Locked",
        href: "project-submission.html",
        locked: !hasPrograms,
      },
      {
        icon: "🎯",
        title: "Final Interview",
        desc: hasFinalInterview ? "Final interview completed! Check your results." : "Resume-based viva — questions drawn from your projects and skills.",
        status: hasFinalInterview ? "done" : hasProjects ? "active" : "locked",
        statusLabel: hasFinalInterview ? "✓ Completed" : hasProjects ? "Start Final Viva" : "Submit projects first",
        href: "final-interview.html",
        locked: !hasProjects,
      },
      {
        icon: "📄",
        title: "My Resume",
        desc: "AI-generated resume built from your interview, courses, and projects.",
        status: hasInterview ? "active" : "locked",
        statusLabel: hasInterview ? "Generate Resume" : "Complete interview first",
        href: "resume.html",
        locked: !hasInterview,
      },
      {
        icon: "📺",
        title: "Learning Resources",
        desc: "Curated YouTube playlists for all 4 programs — watch at your own pace.",
        status: "active",
        statusLabel: "View Resources",
        href: "resources.html",
        locked: false,
      },
    ];

    grid.innerHTML = cards.map(c => `
      <a class="card ${c.locked ? 'locked' : ''} ${c.status === 'done' ? 'completed' : ''}"
         href="${c.locked ? '#' : c.href}">
        <div class="card-icon">${c.icon}</div>
        <div class="card-title">${c.title}</div>
        <div class="card-desc">${c.desc}</div>
        <span class="card-status ${
          c.status === 'done' ? 'status-done' :
          c.status === 'active' ? 'status-active' :
          c.status === 'pending' ? 'status-pending' :
          'status-locked'
        }">${c.statusLabel}</span>
      </a>
    `).join("");
  }

  loadDashboard();
</script>

</body>
</html>
